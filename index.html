<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css files/style.css" />
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- fonts -->
    <title>Calculate App</title>
  </head>
  <body>
    <header>
      <div class="container">
        <h2>calc</h2>
        <div class="mode">
          <p>theme</p>
          <div class="theme">
            <div class="order"><span>1</span><span>2</span><span>3</span></div>
            <div class="moving"><span class="movingCircle"></span></div>
          </div>
        </div>
      </div>
    </header>
    <section class="Calculate">
      <div class="container">
        <div class="contain">
          <input id="CalculateScreen" type="text" />
        </div>

        <div class="content">
          <ul class="CalculateBody">
            <li>7</li>
            <li>8</li>
            <li>9</li>
            <li class="del">DEL</li>
            <li>4</li>
            <li>5</li>
            <li>6</li>
            <li class="adding">+</li>
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li class="minus">-</li>
            <li class="dot">.</li>
            <li>0</li>
            <li class="divide">/</li>
            <li class="multiple">×</li>
          </ul>
          <div class="btns">
            <button class="reset">RESET</button>
            <button class="ANS">ANS</button>
            <button class="undo">undo</button>
            <button class="equal">=</button>
          </div>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
